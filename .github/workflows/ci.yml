name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest
      - name: Build sdist and wheel, check metadata, install into a clean environment
        run: |
          python -m build --outdir dist
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          python -m twine check --strict (Get-ChildItem dist\* | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw "twine check failed" }
          $wheels = @(Get-ChildItem dist\*.whl)
          $sdists = @(Get-ChildItem dist\*.tar.gz)
          if ($wheels.Count -ne 1) { throw "expected one wheel" }
          if ($sdists.Count -ne 1) { throw "expected one sdist" }
          $venv = Join-Path $env:RUNNER_TEMP "codex-broker-clean"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "clean install failed" }
          & (Join-Path $venv "Scripts\codex-broker.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "codex-broker --help failed" }
